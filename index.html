<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart GTA Clothing Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
  <div class="w-full max-w-xl bg-gray-800 rounded-2xl p-8 shadow-2xl">
    <h1 class="text-3xl font-bold text-center mb-6">Smart Forge Search</h1>

    <form id="searchForm" class="space-y-4">
      <input
        id="query"
        type="text"
        placeholder="e.g. Brown Sessanta Nove Varsity"
        class="w-full p-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />

      <div class="flex justify-center gap-4">
        <label class="flex items-center gap-2">
          <input type="radio" name="gender" value="male" class="accent-indigo-500" /> Male
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="gender" value="female" class="accent-indigo-500" /> Female
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="gender" value="" class="accent-indigo-500" checked /> Any
        </label>
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition-all font-semibold"
      >
        Search
      </button>
    </form>

    <div id="result" class="mt-6 text-center"></div>
  </div>

  <script>
    const form = document.getElementById("searchForm");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      resultBox.innerHTML = `<p class="text-gray-400">Searching...</p>`;

      const query = document.getElementById("query").value.trim();
      const gender = document.querySelector('input[name="gender"]:checked').value;

      if (!query) {
        resultBox.innerHTML = `<p class="text-red-400">Please enter a search term.</p>`;
        return;
      }

      try {
        const resp = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, gender }),
        });
        const data = await resp.json();

        if (!data.ok) {
          resultBox.innerHTML = `<p class="text-yellow-400">${data.message || "No results found."}</p>`;
          return;
        }

        resultBox.innerHTML = `
          <p class="text-gray-300 mb-2">Match found (${data.gender}):</p>
          <a href="${data.result.href}" target="_blank" 
             class="text-indigo-400 hover:underline break-words">
             ${data.result.text}
          </a>
        `;
      } catch {
        resultBox.innerHTML = `<p class="text-red-400">Error searching. Try again later.</p>`;
      }
    });
  </script>
</body>
</html>
