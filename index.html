<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Forge Search Debug</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
body { transition: background 0.3s, color 0.3s; }
input, button { transition: all 0.25s ease; }
a { transition: color 0.25s; }
.copy-btn { cursor:pointer; transition: all 0.2s; }
.copy-btn:hover { color: #818cf8; }
.highlight { background-color: #334155; padding: 0 4px; border-radius: 3px; }
.debug { background: #1e293b; padding: 8px; margin-top: 8px; border-radius: 6px; font-size: 0.875rem; white-space: pre-wrap; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">

<div class="w-full max-w-xl bg-gray-800 rounded-2xl p-8 shadow-2xl">
  <h1 class="text-3xl font-bold text-center mb-6">Smart Forge Search (Debug)</h1>

  <form id="searchForm" class="space-y-4">
    <input id="query" type="text" placeholder="e.g. Brown Sessanta Nove Varsity"
           class="w-full p-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">

    <div class="flex justify-center gap-4">
      <label class="flex items-center gap-2"><input type="radio" name="gender" value="male" class="accent-indigo-500" /> Male</label>
      <label class="flex items-center gap-2"><input type="radio" name="gender" value="female" class="accent-indigo-500" /> Female</label>
      <label class="flex items-center gap-2"><input type="radio" name="gender" value="" class="accent-indigo-500" checked /> Any</label>
    </div>

    <button type="submit" class="w-full py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 transition-all font-semibold">
      Search
    </button>
  </form>

  <div id="result" class="mt-6 text-center"></div>
  <div id="debug" class="debug"></div>
</div>

<script>
const form = document.getElementById("searchForm");
const resultBox = document.getElementById("result");
const debugBox = document.getElementById("debug");

function highlightQuery(text, query) {
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, "gi");
  return text.replace(regex, '<span class="highlight">$1</span>');
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = document.getElementById("query").value.trim();
  const gender = document.querySelector('input[name="gender"]:checked').value;
  resultBox.innerHTML = `<p class="text-gray-400">Searching...</p>`;
  debugBox.innerHTML = '';

  if (!query) {
    resultBox.innerHTML = `<p class="text-red-400">Please enter a search term.</p>`;
    return;
  }

  try {
    const genderSuffix = gender ? `${gender} ` : "";
    const searchQuery = `${query} clothes ${genderSuffix}site:forge.pleb.masters.de`;
    debugBox.innerHTML += `Query sent to DuckDuckGo: "${searchQuery}"\n`;

    // DuckDuckGo HTML via proxy (CORS bypass)
    const ddgUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://duckduckgo.com/html/?q=${encodeURIComponent(searchQuery)}`)}`;
    const { data } = await axios.get(ddgUrl);

    const parser = new DOMParser();
    const doc = parser.parseFromString(data.contents, "text/html");
    const links = Array.from(doc.querySelectorAll("a.result__a"));
    debugBox.innerHTML += `Total links found in search results: ${links.length}\n`;

    let results = [];
    for (const el of links) {
      const href = el.getAttribute("href");
      const text = el.textContent;
      debugBox.innerHTML += `Found link: ${text} -> ${href}\n`;
      if (href && href.includes("forge.plebmasters.de") && /clothes/.test(href)) {
        results.push({ href, text });
      }
    }
    debugBox.innerHTML += `Links matching filter (forge + clothes): ${results.length}\n`;

    if (!results.length) {
      resultBox.innerHTML = `<p class="text-yellow-400">No matching link found.</p>`;
      return;
    }

    // Score results: exact match + gender match
    const scored = results.map(r => {
      let score = 0;
      if (r.text.toLowerCase().includes(query.toLowerCase())) score += 10;
      const desc = r.text.toLowerCase();
      if (gender && desc.includes(gender.toLowerCase())) score += 5;
      return { ...r, score };
    });

    scored.sort((a,b) => b.score - a.score);
    const topResults = scored.slice(0,3);

    resultBox.innerHTML = topResults.map(r => {
      let detectedGender = "Unknown";
      const desc = r.text.toLowerCase();
      if (desc.includes("female")) detectedGender = "Female";
      else if (desc.includes("male")) detectedGender = "Male";

      return `
        <div class="mb-4">
          <p class="text-gray-300 mb-1">${highlightQuery(r.text, query)} (${detectedGender})</p>
          <a href="${r.href}" target="_blank" class="text-indigo-400 hover:underline break-words">${r.href}</a>
          <button class="copy-btn ml-2 text-gray-400" onclick="navigator.clipboard.writeText('${r.href}').then(()=>alert('Link copied!'))">📋 Copy</button>
        </div>
      `;
    }).join("");

  } catch(err) {
    console.error(err);
    resultBox.innerHTML = `<p class="text-red-400">Error fetching results. Try again later.</p>`;
    debugBox.innerHTML += `Error: ${err.message}`;
  }
});
</script>
</body>
</html>
